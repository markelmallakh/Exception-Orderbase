<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Make Your Cake — Exception</title>
    <meta
      name="description"
      content="Play cake designer — build your own Exception cake live in 3D: shape, size, height, flavour, filling, decoration and colour, updated as you go."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script defer src="scripts.js"></script>
  </head>
  <body data-page="make-your-cake" data-path="/shop/make-your-cake" class="antialiased bg-white">
    <div id="site-header"></div>

    <main class="overflow-x-hidden">
      <!-- ============================ HERO ============================ -->
      <section class="bg-gray-100 pt-8 lg:pt-12 pb-6">
        <div class="container">
          <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm text-gray-700 mb-5">
            <a href="index.html" class="hover:text-primaryDark transition-colors">Home</a>
            <span class="text-gray-400">/</span>
            <span class="text-primaryDark font-medium">Make Your Cake</span>
          </nav>
          <div class="flex flex-col items-center gap-3 text-center max-w-[640px] mx-auto">
            <span class="eyebrow">Make Your Cake</span>
            <h1 class="text-[30px] lg:text-[46px] font-semibold leading-[115%] text-textSecondary">Play Cake <span class="text-primary">Designer</span></h1>
            <p class="text-sm lg:text-base text-gray-700 leading-[150%]">Build your cake live in 3D — every choice reshapes it right before your eyes. When it's perfect, add it to your cart.</p>
          </div>
        </div>
      </section>

      <!-- ============================ BUILDER ============================ -->
      <section class="bg-gray-100 pb-16 lg:pb-24">
        <div class="container">
          <div class="mx-auto max-w-[1220px] grid gap-6 lg:grid-cols-[minmax(0,0.86fr)_minmax(0,1.14fr)] lg:items-stretch" data-cake-builder>
            <!-- Live 3D cake on the studio floor -->
            <div class="relative overflow-hidden rounded-[24px] border border-gray-300 bg-white p-6 flex flex-col items-center justify-center">
              <div class="cake-stage w-full" style="min-height:380px">
                <div class="cake-drop w-full" style="height:340px">
                  <div class="c3 c3--live" id="liveCake"></div>
                </div>
              </div>
              <p class="mt-7 text-sm font-semibold text-textSecondary text-center" data-cake-summary></p>
            </div>

            <!-- Config: tabs + options -->
            <div class="flex flex-col overflow-hidden rounded-[24px] border border-gray-300 bg-white">
              <div class="border-b border-gray-300 px-4 md:px-5 py-4" data-cake-tabs></div>
              <div class="flex-1 px-5 md:px-6 py-6 overflow-y-auto" style="max-height:520px" data-cake-panel></div>
              <div class="flex items-center gap-3 border-t border-gray-300 px-5 md:px-6 py-4">
                <button type="button" class="btn btn--secondary btn--md whitespace-nowrap" data-back>Back</button>
                <button type="button" class="btn btn--primary btn--md flex-1 justify-center" data-next>Next</button>
                <button type="button" class="btn btn--primary btn--md flex-1 justify-center" data-add hidden>Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <!-- Themed-topper picker. A .modal-shell so the shared plumbing closes it:
         [data-close] and backdrop clicks are handled globally in scripts.js. -->
    <div data-modal="themes" class="modal-shell">
      <div class="flex w-full max-w-[560px] max-h-[85vh] flex-col overflow-hidden rounded-2xl bg-white shadow-custom3">
        <div class="flex shrink-0 items-center justify-between border-b border-neutral-100 px-5 py-4">
          <div>
            <h2 class="font-semibold text-textSecondary text-lg">Choose Your Themes</h2>
            <p class="text-xs text-gray-500">Hand-made sugar-paste figures — add up to four.</p>
          </div>
          <button type="button" data-close aria-label="Close" class="grid place-items-center w-8 h-8 rounded-full hover:bg-neutral-100 text-textSecondary">
            <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-4" data-themes-body></div>
        <div class="flex shrink-0 items-center gap-3 border-t border-neutral-100 px-5 py-4">
          <span class="text-sm text-gray-600" data-themes-count>0 / 4 selected</span>
          <button type="button" class="btn btn--primary btn--md ms-auto" data-themes-confirm>Add Themes</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const builder = document.querySelector("[data-cake-builder]");
        if (!builder) return;
        const tabsEl = builder.querySelector("[data-cake-tabs]");
        const panelEl = builder.querySelector("[data-cake-panel]");
        const summaryEl = builder.querySelector("[data-cake-summary]");
        const liveCake = document.getElementById("liveCake");
        const addBtn = builder.querySelector("[data-add]");
        const backBtn = builder.querySelector("[data-back]");
        const nextBtn = builder.querySelector("[data-next]");

        /* ================= Reference data (exception-group.com/custom-cakes) ================= */
        const SHAPES = [
          { id: "rectangle", name: "Rectangle" },
          { id: "square", name: "Square" },
          { id: "circle", name: "Round" },
        ];
        const TYPES = [
          { id: "sponge", name: "Sponge Cake", sub: "Cream-coated · 8 cm" },
          { id: "sugar", name: "Sugar Cake", sub: "Fondant · up to 22 cm tall" },
        ];
        /* Sizes depend on the chosen shape (live-site data). w/d in cm; circle = diameter. */
        const SIZES = {
          rectangle: [
            { id: "30*40", name: "30 × 40", serves: 20, w: 40, d: 30 },
            { id: "40*60", name: "40 × 60", serves: 30, w: 60, d: 40 },
            { id: "60*80", name: "60 × 80", serves: 35, w: 80, d: 60 },
            { id: "80*120", name: "80 × 120", serves: 45, w: 120, d: 80 },
          ],
          square: [
            { id: "25*25", name: "25 × 25", serves: 10, w: 25, d: 25 },
            { id: "30*30", name: "30 × 30", serves: 15, w: 30, d: 30 },
            { id: "40*40", name: "40 × 40", serves: 25, w: 40, d: 40 },
          ],
          circle: [
            { id: "20", name: "20 cm", serves: 4, r: 20 },
            { id: "24", name: "24 cm", serves: 8, r: 24 },
            { id: "26", name: "26 cm", serves: 10, r: 26 },
            { id: "28", name: "28 cm", serves: 12, r: 28 },
            { id: "30", name: "30 cm", serves: 15, r: 30 },
            { id: "40", name: "40 cm", serves: 20, r: 40 },
            { id: "50", name: "50 cm", serves: 25, r: 50 },
          ],
        };
        /* Heights depend on the cake type (sponge is always 8 cm). */
        const HEIGHTS = { sponge: ["8"], sugar: ["8", "12", "16", "22"] };
        const FLAVOURS = [
          { id: "chocolate", name: "Chocolate" },
          { id: "vanilla", name: "Vanilla" },
          { id: "half", name: "Half & Half" },
        ];
        const AMOUNTS = [
          { id: "0", name: "Without" },
          { id: "100", name: "100 gm" },
          { id: "200", name: "200 gm" },
          { id: "300", name: "300 gm" },
        ];
        /* Decoration is optional, so "Without" leads the list — same
           pattern as the Filling amounts and the Message step. */
        const STYLES = [
          { id: "none", name: "Without Decoration" },
          { id: "classic", name: "Classic Cream" },
          { id: "fruits", name: "Fruit Topping" },
          { id: "drip", name: "Chocolate Drip" },
          { id: "themed", name: "Themed Topper" },
        ];
        /* Sugar-paste figures placed on top. Two tiers, matching the live
           configurator's cutouts (large 250 EGP / small 170 EGP, max 4).
           Names + emoji stand in for the real photographed catalogue. */
        const THEME_MAX = 4;
        const THEMES = [
          { id: "dino", name: "Dinosaur", emoji: "🦕", tier: "large" },
          { id: "shark", name: "Shark", emoji: "🦈", tier: "large" },
          { id: "unicorn", name: "Unicorn", emoji: "🦄", tier: "large" },
          { id: "safari", name: "Safari Animals", emoji: "🦁", tier: "large" },
          { id: "racecar", name: "Race Car", emoji: "🏎️", tier: "large" },
          { id: "princess", name: "Princess Castle", emoji: "🏰", tier: "large" },
          { id: "space", name: "Rocket & Space", emoji: "🚀", tier: "large" },
          { id: "teddy", name: "Teddy Bear", emoji: "🧸", tier: "large" },
          { id: "football", name: "Football", emoji: "⚽", tier: "small" },
          { id: "balloons", name: "Balloons", emoji: "🎈", tier: "small" },
          { id: "flowers", name: "Flowers", emoji: "🌸", tier: "small" },
          { id: "stars", name: "Stars", emoji: "⭐", tier: "small" },
          { id: "hearts", name: "Hearts", emoji: "💛", tier: "small" },
          { id: "crown", name: "Crown", emoji: "👑", tier: "small" },
          { id: "music", name: "Music Notes", emoji: "🎵", tier: "small" },
          { id: "graduation", name: "Graduation Cap", emoji: "🎓", tier: "small" },
        ];
        const THEME_PRICE = { large: 250, small: 170 };
        const THEME_MAP = {};
        THEMES.forEach((t) => (THEME_MAP[t.id] = t));
        /* The live configurator's 14 colours, tuned to pastry-friendly tones. */
        const COLOURS = [
          { id: "white", name: "White", hex: "#fff6ea" },
          { id: "pink", name: "Pink", hex: "#f6bcc9" },
          { id: "fuchsia", name: "Fuchsia", hex: "#d63384" },
          { id: "red", name: "Red", hex: "#d95252" },
          { id: "orange", name: "Orange", hex: "#f0954f" },
          { id: "yellow", name: "Yellow", hex: "#f2d55c" },
          { id: "gold", name: "Gold", hex: "#d9b04c" },
          { id: "green", name: "Green", hex: "#8fbc7a" },
          { id: "babyblue", name: "Baby Blue", hex: "#a8d3e8" },
          { id: "blue", name: "Blue", hex: "#5b8ed6" },
          { id: "purple", name: "Purple", hex: "#a37ec9" },
          { id: "silver", name: "Silver", hex: "#cfd4da" },
          { id: "brown", name: "Brown", hex: "#8a5a3b" },
          { id: "black", name: "Black", hex: "#3c3c40" },
        ];
        const SPONGE = { chocolate: "#5c3a24", vanilla: "#efd9b4" };
        const NUT_C = "#c9a66b";
        const FRU_C = "#e26d8a";
        const DRIP_C = "#4a2e1a";
        const AMOUNT_H = { "0": 0, "100": 6, "200": 11, "300": 16 }; /* stripe px on the live cake */

        /* ================= State ================= */
        /* These values only DRIVE THE 3D PREVIEW — they are not choices.
           Apart from Shape (step 1), nothing shows as selected until the
           customer actually picks it; `touched` is what marks a real
           choice, and the option cards read their active state from it. */
        const state = {
          shape: "circle", type: "sponge", size: "28", height: "8",
          flavour: "vanilla", nuts: "0", fruits: "0",
          style: "classic", colour: "white", themes: [], message: "", msgOn: "",
        };
        const touched = {};
        /* an option is highlighted only once the customer has chosen it */
        const sel = (key, val) => !!touched[key] && state[key] === val;
        let tab = 0;

        /* ================= 3D engine ================= */
        const SEGS = 20;
        function hx(h) { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
        function shade(hex, k) {
          const c = hx(hex).map((v) => (k <= 1 ? v * k : v + (255 - v) * (k - 1)));
          return "rgb(" + c.map((v) => Math.round(Math.max(0, Math.min(255, v)))).join(",") + ")";
        }
        function lum(hex) { const c = hx(hex); return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255; }
        function el(cls) { const d = document.createElement("div"); d.className = cls; return d; }
        function layers(face) {
          face.appendChild(el("c3-lip"));
          face.appendChild(el("c3-nut"));
          face.appendChild(el("c3-fru"));
          face.appendChild(el("c3-drip"));
        }
        /* Wall lighting: light comes from the front-top-right (matches the ¾ view). */
        const BOX_K = { front: 1.0, right: 0.86, left: 0.6, back: 0.55 };
        const RIGS = new WeakMap();
        function buildCake(root, shape) {
          root.innerHTML = "";
          const shadow = el("c3__shadow");
          const pos = el("c3__pos");
          const rig = el("c3__rig");
          pos.appendChild(rig);
          const topper = el("c3__topper");
          root.appendChild(shadow);
          root.appendChild(pos);
          root.appendChild(topper);
          const rec = { shape, walls: [], top: null, word: null, topper };
          if (shape === "circle") {
            for (let i = 0; i < SEGS; i++) {
              const a = i * (360 / SEGS);
              const s = el("c3s");
              s.style.setProperty("--a", a + "deg");
              /* brightness follows the light direction; +30° matches the view angle */
              const k = 0.6 + 0.42 * Math.max(0, Math.cos(((a - 30) * Math.PI) / 180));
              layers(s);
              rec.walls.push({ el: s, k, a });
              rig.appendChild(s);
            }
            const disc = el("c3f c3f--disc");
            rec.top = disc;
            rig.appendChild(disc);
          } else {
            [["front", "c3f--front"], ["right", "c3f--right"], ["left", "c3f--left"], ["back", "c3f--back"]].forEach(([side, cls]) => {
              const w = el("c3f " + cls);
              layers(w);
              rec.walls.push({ el: w, k: BOX_K[side], side });
              rig.appendChild(w);
            });
            const top = el("c3f c3f--top");
            rec.top = top;
            rig.appendChild(top);
          }
          const word = el("c3-word");
          rec.word = word;
          rec.top.appendChild(word);
          RIGS.set(root, rec);
          return rec;
        }
        /* Geometry px from real cm (live scale; minis pass mini=true). */
        function setGeometry(root, s, mini) {
          const size = SIZES[s.shape].find((x) => x.id === s.size) || SIZES[s.shape][0];
          const hCm = parseInt(s.height, 10) || 8;
          const K = mini ? 0.42 : 1;
          const chh = (16 + hCm * 4.6) * K;
          let shw;
          if (s.shape === "circle") {
            const cr = (24 + (size.r || 26) * 1.32) * K;
            root.style.setProperty("--cr", cr + "px");
            shw = cr * 2.35;
          } else {
            const cw = (26 + size.w * 1.45) * K;
            const cd = (26 + size.d * 1.45) * K;
            root.style.setProperty("--cw", cw + "px");
            root.style.setProperty("--cd", cd + "px");
            shw = cw * 1.32;
          }
          root.style.setProperty("--chh", chh + "px");
          root.style.setProperty("--shw", shw + "px");
          root.style.setProperty("--wordFs", (mini ? 6 : 15) + "px");
          root.style.setProperty("--topFs", (mini ? 15 : 30) + "px");
        }
        function paintCake(root, s) {
          const rec = RIGS.get(root);
          if (!rec) return;
          const frost = (COLOURS.find((c) => c.id === s.colour) || COLOURS[0]).hex;
          const choc = SPONGE.chocolate, van = SPONGE.vanilla;
          rec.walls.forEach((w) => {
            let base;
            if (s.flavour === "half") {
              if (rec.shape === "circle") {
                /* split the cylinder left/right as seen from the camera */
                base = ((w.a + 115) % 360) < 180 ? choc : van;
              } else if (w.side === "left") base = choc;
              else if (w.side === "right") base = van;
              else base = null; /* front/back get a split gradient */
            } else {
              base = s.flavour === "chocolate" ? choc : van;
            }
            if (base) {
              w.el.style.background = shade(base, w.k);
            } else {
              w.el.style.background = "linear-gradient(90deg," + shade(choc, w.k) + " 0 50%," + shade(van, w.k) + " 50% 100%)";
            }
            const kids = w.el.children;
            kids[0].style.background = shade(frost, w.k); /* lip / fondant coat */
            kids[1].style.background = shade(NUT_C, w.k);
            kids[2].style.background = shade(FRU_C, w.k);
            kids[3].style.background = s.style === "drip" ? shade(DRIP_C, Math.min(1, w.k + 0.06)) : "transparent";
          });
          rec.top.style.background = shade(frost, 1.1);
          root.style.setProperty("--lipH", s.type === "sugar" ? "100%" : "26%");
          root.style.setProperty("--nutsH", AMOUNT_H[s.nuts] + "px");
          root.style.setProperty("--fruH", AMOUNT_H[s.fruits] + "px");
          rec.word.textContent = s.message || "";
          rec.word.style.color = lum(frost) > 0.55 ? "#7a4a2a" : "#fff6ea";
          /* Topper: chosen sugar-paste figures stand on the cake; falls back
             to a single star until the user picks any. */
          let top = "";
          if (s.style === "fruits") top = "🍓";
          else if (s.style === "themed") {
            const picked = (s.themes || []).map((id) => THEME_MAP[id] && THEME_MAP[id].emoji).filter(Boolean);
            top = picked.length ? picked.join("") : "⭐";
          }
          rec.topper.textContent = top;
          /* Several figures side by side need to shrink so they stay on the cake. */
          const n = (s.style === "themed" && (s.themes || []).length) || 1;
          rec.topper.style.fontSize = n > 2 ? "calc(var(--topFs) * 0.58)" : n > 1 ? "calc(var(--topFs) * 0.78)" : "";
        }
        /* Mini preview: a static snapshot of the current cake with overrides. */
        function miniCake(overrides) {
          const s = Object.assign({}, state, overrides);
          const holder = el("c3");
          holder.style.width = "84px";
          holder.style.height = "84px";
          buildCake(holder, s.shape);
          setGeometry(holder, s, true);
          paintCake(holder, s);
          return holder;
        }

        /* ================= Live cake updates ================= */
        let liveShape = null;
        function updateCake(pop) {
          if (liveShape !== state.shape) {
            liveShape = state.shape;
            buildCake(liveCake, state.shape);
          }
          setGeometry(liveCake, state, false);
          paintCake(liveCake, state);
          const rec = RIGS.get(liveCake);
          if (pop && rec.topper.textContent) {
            rec.topper.classList.remove("drop");
            void rec.topper.offsetWidth;
            rec.topper.classList.add("drop");
          }
          if (pop) {
            liveCake.classList.remove("is-pop");
            void liveCake.offsetWidth;
            liveCake.classList.add("is-pop");
          }
          const size = SIZES[state.shape].find((x) => x.id === state.size);
          const bits = [
            SHAPES.find((x) => x.id === state.shape).name + (size ? " " + size.name : ""),
            state.height + " cm",
            FLAVOURS.find((x) => x.id === state.flavour).name,
          ];
          if (state.nuts !== "0") bits.push("Nuts " + state.nuts + "g");
          if (state.fruits !== "0") bits.push("Fruits " + state.fruits + "g");
          if (state.style === "themed" && state.themes.length)
            bits.push(state.themes.length + (state.themes.length > 1 ? " themes" : " theme"));
          summaryEl.textContent = bits.join("  ·  ");
        }

        /* ================= Steps ================= */
        const STEPS = [
          { key: "shapeStep", label: "Shape", done: () => touched.shape && touched.type },
          { key: "sizeStep", label: "Size", done: () => touched.size && touched.height },
          { key: "flavourStep", label: "Flavour", done: () => touched.flavour },
          { key: "fillingStep", label: "Filling", done: () => touched.nuts && touched.fruits },
          /* "Without Decoration" completes the step on its own — there's
             no frosting colour to pick when there's no decoration. */
          { key: "decoStep", label: "Decoration", done: () => touched.style && (state.style === "none" || touched.colour) },
          { key: "messageStep", label: "Message", done: () => touched.message },
        ];

        function groupHead(txt, sub) {
          const h = el("flex items-baseline justify-between gap-3 mb-3");
          h.innerHTML =
            '<span class="text-sm font-semibold text-textSecondary">' + txt + "</span>" +
            (sub ? '<span class="text-xs text-gray-500">' + sub + "</span>" : "");
          return h;
        }
        function optGrid(cols) {
          return el("grid gap-3 mb-6 " + (cols || "grid-cols-2 sm:grid-cols-3"));
        }
        function optCard(key, id, active, inner, name, sub) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "myc-opt" + (active ? " is-active" : "");
          b.setAttribute("data-pick", key);
          b.setAttribute("data-val", id);
          b.innerHTML =
            (inner ? '<span class="grid place-items-center h-[84px] w-full pointer-events-none" data-mini></span>' : "") +
            '<span class="font-semibold text-sm text-textSecondary pointer-events-none">' + name + "</span>" +
            (sub ? '<span class="text-xs text-gray-500 pointer-events-none">' + sub + "</span>" : "");
          return b;
        }
        function addMini(card, overrides) {
          card.querySelector("[data-mini]").appendChild(miniCake(overrides));
        }
        function footprint(size, shape) {
          const f = el("myc-foot pointer-events-none");
          if (shape === "circle") {
            const d = 18 + (size.r || 20) * 0.6;
            f.style.width = d + "px"; f.style.height = d + "px"; f.style.borderRadius = "50%";
          } else {
            f.style.width = 12 + size.w * 0.32 + "px"; f.style.height = 12 + size.d * 0.32 + "px"; f.style.borderRadius = "4px";
          }
          const wrap = el("grid place-items-center h-[64px] w-full pointer-events-none");
          wrap.appendChild(f);
          return wrap;
        }

        function renderPanel() {
          panelEl.innerHTML = "";
          const panel = el("cake-panel");
          const stepKey = STEPS[tab].key;

          if (stepKey === "shapeStep") {
            panel.appendChild(groupHead("What shape would you like?"));
            let g = optGrid("grid-cols-3");
            SHAPES.forEach((o) => {
              const c = optCard("shape", o.id, state.shape === o.id, true, o.name);
              g.appendChild(c);
              addMini(c, { shape: o.id, size: SIZES[o.id][Math.min(1, SIZES[o.id].length - 1)].id, height: "8", message: "" });
            });
            panel.appendChild(g);
            panel.appendChild(groupHead("Cake type", "Sugar paste unlocks tall cakes"));
            g = optGrid("grid-cols-2");
            TYPES.forEach((o) => {
              const c = optCard("type", o.id, state.type === o.id, true, o.name, o.sub);
              g.appendChild(c);
              addMini(c, { type: o.id, height: "8", message: "" });
            });
            panel.appendChild(g);
          } else if (stepKey === "sizeStep") {
            panel.appendChild(groupHead("How big should it be?", "Sizes follow the shape"));
            let g = optGrid(state.shape === "circle" ? "grid-cols-3 sm:grid-cols-4" : "grid-cols-2 sm:grid-cols-4");
            SIZES[state.shape].forEach((o) => {
              const c = optCard("size", o.id, sel("size", o.id), false, o.name, "Serves ~" + o.serves);
              c.insertBefore(footprint(o, state.shape), c.firstChild);
              g.appendChild(c);
            });
            panel.appendChild(g);
            const hs = HEIGHTS[state.type];
            panel.appendChild(groupHead("How tall?", state.type === "sponge" ? "Sponge cakes come 8 cm — pick Sugar Cake for tall tiers" : "Fondant holds up to 22 cm"));
            g = optGrid("grid-cols-2 sm:grid-cols-4");
            hs.forEach((h) => {
              const c = optCard("height", h, sel("height", h), true, h + " cm");
              g.appendChild(c);
              addMini(c, { height: h, message: "" });
            });
            panel.appendChild(g);
          } else if (stepKey === "flavourStep") {
            panel.appendChild(groupHead("Pick your sponge flavour"));
            const g = optGrid("grid-cols-3");
            FLAVOURS.forEach((o) => {
              const c = optCard("flavour", o.id, sel("flavour", o.id), true, o.name);
              g.appendChild(c);
              addMini(c, { flavour: o.id, type: "sponge", message: "" });
            });
            panel.appendChild(g);
          } else if (stepKey === "fillingStep") {
            /* Filling is optional — "Without <topic>" leads each group. */
            const amountGrid = (key, topic, emoji) => {
              const g = optGrid("grid-cols-2 sm:grid-cols-4");
              AMOUNTS.forEach((o) => {
                const zero = o.id === "0";
                g.appendChild(
                  optCard(key, o.id, sel(key, o.id), false, zero ? "Without " + topic : o.name, zero ? " " : emoji.repeat(o.id / 100))
                );
              });
              return g;
            };
            panel.appendChild(groupHead("Extra nuts", "Optional — the sponge already has its own filling"));
            panel.appendChild(amountGrid("nuts", "Nuts", "🥜"));
            panel.appendChild(groupHead("Extra fruits", "Optional"));
            panel.appendChild(amountGrid("fruits", "Fruits", "🍓"));
          } else if (stepKey === "decoStep") {
            panel.appendChild(groupHead("Decoration style", "Optional"));
            const g = optGrid("grid-cols-2 sm:grid-cols-4");
            STYLES.forEach((o) => {
              const c = optCard("style", o.id, sel("style", o.id), true, o.name);
              g.appendChild(c);
              addMini(c, { style: o.id, colour: o.id === "none" ? "white" : state.colour, message: "" });
            });
            panel.appendChild(g);
            if (state.style === "themed") {
              const row = el("mb-6 flex flex-wrap items-center gap-2 rounded-[14px] border border-gray-200 bg-gray-50 p-3");
              if (state.themes.length) {
                state.themes.forEach((id) => {
                  const t = THEME_MAP[id];
                  if (!t) return;
                  const chip = el("inline-flex items-center gap-1.5 rounded-full bg-white border border-gray-200 px-3 py-1.5 text-sm text-textSecondary");
                  chip.innerHTML = '<span class="text-base leading-none">' + t.emoji + "</span>" + t.name;
                  row.appendChild(chip);
                });
              } else {
                const hint = el("text-sm text-gray-500");
                hint.textContent = "No figures chosen yet.";
                row.appendChild(hint);
              }
              const edit = document.createElement("button");
              edit.type = "button";
              edit.className = "btn btn--secondary btn--sm ms-auto";
              edit.setAttribute("data-open-themes", "");
              edit.textContent = state.themes.length ? "Edit Themes" : "Choose Themes";
              row.appendChild(edit);
              panel.appendChild(row);
            }
            /* "Without Decoration" means a plain cake — there's no
               frosting to colour, so the swatches step aside. */
            if (state.style === "none") {
              panelEl.appendChild(panel);
              return;
            }
            panel.appendChild(groupHead("Frosting colour"));
            const sw = el("flex flex-wrap gap-2.5 mb-2");
            COLOURS.forEach((o) => {
              const b = document.createElement("button");
              b.type = "button";
              b.title = o.name;
              b.className = "myc-swatch" + (sel("colour", o.id) ? " is-active" : "");
              b.style.background = o.hex;
              b.setAttribute("data-pick", "colour");
              b.setAttribute("data-val", o.id);
              sw.appendChild(b);
            });
            panel.appendChild(sw);
          } else {
            /* The message is optional, so it opens with the same
               Without / With choice the other optional steps use — the
               text field only appears once "With" is picked. */
            panel.appendChild(groupHead("A message on the cake?", "Optional — piped by hand, free"));
            const g = optGrid("grid-cols-2");
            g.appendChild(optCard("msgOn", "0", sel("msgOn", "0"), false, "Without Message", "Leave the cake plain"));
            g.appendChild(optCard("msgOn", "1", sel("msgOn", "1"), false, "With Message", "Up to 24 characters"));
            panel.appendChild(g);
            if (state.msgOn === "1") {
              const inp = document.createElement("input");
              inp.type = "text";
              inp.maxLength = 24;
              inp.placeholder = "e.g. Happy Birthday Mariam";
              inp.value = state.message;
              inp.setAttribute("data-cake-text", "");
              inp.className = "h-12 w-full rounded-lg border border-customGrayMedium focus:border-primary px-4 text-sm text-textSecondary outline-none transition-colors";
              panel.appendChild(inp);
              const note = el("text-xs text-gray-500 mt-2");
              note.textContent = "Watch it appear on the cake as you type. Want it on the base instead? +30 EGP at checkout.";
              panel.appendChild(note);
            }
          }
          panelEl.appendChild(panel);
        }

        /* ================= Stepper =================
           Sequential, but every finished step stays editable: click any
           completed step (or the current one) to go back and change it.
           Steps ahead of the furthest unlocked one stay disabled so the
           flow can't be skipped. */
        const LAST = STEPS.length - 1;
        /* Only Shape, Size and Flavour describe a cake we can actually
           bake — Filling, Decoration and Message are all optional, so
           Add to Cart doesn't wait on them. */
        const REQUIRED = STEPS.slice(0, 3);
        const allRequiredDone = () => REQUIRED.every((st) => st.done());
        let maxReached = 0; /* furthest step actually visited — unlocks the stepper dots */
        const furthest = () => {
          /* everything up to the first unfinished step is reachable, plus
             wherever the user has already walked with Next */
          let firstOpen = LAST;
          for (let i = 0; i < STEPS.length; i++) {
            if (!STEPS[i].done()) { firstOpen = i; break; }
          }
          return Math.max(firstOpen, maxReached);
        };

        function buildStepper() {
          tabsEl.innerHTML =
            '<div class="myc-stepper">' +
            STEPS.map((t, i) =>
              '<button type="button" class="myc-step" data-cake-step="' + i + '">' +
              '<span class="myc-step__dot"><span class="myc-step__num">' + (i + 1) + '</span>' +
              '<svg class="myc-step__check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</span><span class="myc-step__label">' + t.label + "</span></button>" +
              (i < LAST ? '<span class="myc-step__line"></span>' : "")
            ).join("") +
            "</div>";
        }
        /* Keep the six steps inside the panel at every width — the row
           must never scroll. Walk down the fallback ladder (see the
           .myc-stepper rules in styles.css) until the row fits. */
        const FIT_MODES = ["is-stacked", "is-compact", "is-bare"];
        function fitStepper() {
          const row = tabsEl.querySelector(".myc-stepper");
          if (!row) return;
          const over = () => row.scrollWidth > row.clientWidth + 1;
          row.classList.remove.apply(row.classList, FIT_MODES);
          for (let i = 0; i < FIT_MODES.length && over(); i++) {
            row.classList.remove.apply(row.classList, FIT_MODES);
            row.classList.add(FIT_MODES[i]);
          }
        }

        function syncStepper() {
          const reach = Math.max(tab, furthest());
          tabsEl.querySelectorAll("[data-cake-step]").forEach((b) => {
            const i = +b.getAttribute("data-cake-step");
            const done = !!STEPS[i].done();
            b.classList.toggle("is-active", i === tab);
            b.classList.toggle("is-done", done && i !== tab);
            const locked = i > reach;
            b.classList.toggle("is-locked", locked);
            b.disabled = locked;
          });
          tabsEl.querySelectorAll(".myc-step__line").forEach((l, i) => {
            l.classList.toggle("is-done", !!STEPS[i].done());
          });
          /* footer: Back / Next until the end, then the gated Add to Cart */
          backBtn.disabled = tab === 0;
          backBtn.classList.toggle("opacity-40", tab === 0);
          const onLast = tab === LAST;
          nextBtn.hidden = onLast;
          addBtn.hidden = !onLast;
          /* Next is always live — browsing the steps shouldn't be blocked.
             Only Add to Cart waits for every required choice. */
          nextBtn.disabled = false;
          nextBtn.classList.remove("opacity-40", "pointer-events-none");
          const ready = allRequiredDone();
          addBtn.disabled = !ready;
          addBtn.classList.toggle("opacity-40", !ready);
          addBtn.classList.toggle("pointer-events-none", !ready);
          addBtn.title = ready ? "" : "Choose a shape, size and flavour to add your cake to the cart";
          /* the active step's label is the only one shown once compact,
             so re-fit whenever the current step changes */
          fitStepper();
        }
        /* Label widths shift when the web font swaps in, and the panel
           width changes with the viewport — re-measure on both. */
        window.addEventListener("resize", fitStepper);
        window.addEventListener("load", fitStepper);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitStepper);
        /* one name for the rest of the file */
        const syncTabs = syncStepper;

        /* ================= Interactions ================= */
        tabsEl.addEventListener("click", (e) => {
          const b = e.target.closest("[data-cake-step]");
          if (!b || b.disabled) return;
          tab = +b.getAttribute("data-cake-step");
          syncStepper();
          renderPanel();
        });
        backBtn.addEventListener("click", () => {
          if (tab > 0) tab--;
          syncStepper();
          renderPanel();
        });
        nextBtn.addEventListener("click", () => {
          if (tab < LAST) tab++;
          maxReached = Math.max(maxReached, tab);
          syncStepper();
          renderPanel();
        });

        /* ---- Themed-topper picker ---- */
        const themesModal = document.querySelector('[data-modal="themes"]');
        const themesBody = themesModal.querySelector("[data-themes-body]");
        const themesCount = themesModal.querySelector("[data-themes-count]");
        const themesConfirm = themesModal.querySelector("[data-themes-confirm]");
        let draftThemes = [];

        function themeTile(t) {
          const on = draftThemes.indexOf(t.id) > -1;
          const full = draftThemes.length >= THEME_MAX && !on;
          return (
            '<button type="button" class="myc-opt' + (on ? " is-active" : "") + (full ? " is-full" : "") +
            '" data-theme="' + t.id + '"' + (full ? " disabled" : "") + ">" +
            '<span class="text-3xl leading-none pointer-events-none">' + t.emoji + "</span>" +
            '<span class="font-semibold text-sm text-textSecondary pointer-events-none">' + t.name + "</span>" +
            '<span class="text-xs text-gray-500 pointer-events-none">' + THEME_PRICE[t.tier] + " EGP</span>" +
            "</button>"
          );
        }
        function renderThemes() {
          const group = (tier, label) =>
            '<div class="mb-3 flex items-baseline justify-between gap-3"><span class="text-sm font-semibold text-textSecondary">' + label +
            '</span><span class="text-xs text-gray-500">' + THEME_PRICE[tier] + ' EGP each</span></div>' +
            '<div class="mb-5 grid grid-cols-2 sm:grid-cols-4 gap-3">' +
            THEMES.filter((t) => t.tier === tier).map(themeTile).join("") + "</div>";
          themesBody.innerHTML = group("large", "Large figures") + group("small", "Small figures");
          const total = draftThemes.reduce((sum, id) => sum + (THEME_MAP[id] ? THEME_PRICE[THEME_MAP[id].tier] : 0), 0);
          themesCount.textContent =
            draftThemes.length + " / " + THEME_MAX + " selected" + (total ? "  ·  +" + total + " EGP" : "");
          themesConfirm.disabled = false;
        }
        function openThemes() {
          draftThemes = state.themes.slice();
          renderThemes();
          themesModal.classList.add("is-open");
          const backdrop = document.querySelector("[data-backdrop]");
          if (backdrop) backdrop.classList.add("is-open");
          document.body.classList.add("no-scroll");
        }
        function closeThemes() {
          themesModal.classList.remove("is-open");
          const backdrop = document.querySelector("[data-backdrop]");
          if (backdrop) backdrop.classList.remove("is-open");
          document.body.classList.remove("no-scroll");
        }
        themesBody.addEventListener("click", (e) => {
          const b = e.target.closest("[data-theme]");
          if (!b) return;
          const id = b.getAttribute("data-theme");
          const i = draftThemes.indexOf(id);
          if (i > -1) draftThemes.splice(i, 1);
          else if (draftThemes.length < THEME_MAX) draftThemes.push(id);
          renderThemes();
        });
        themesConfirm.addEventListener("click", () => {
          state.themes = draftThemes.slice();
          state.style = "themed";
          touched.style = true;
          closeThemes();
          renderPanel();
          syncTabs();
          updateCake(true);
        });

        panelEl.addEventListener("click", (e) => {
          if (e.target.closest("[data-open-themes]")) {
            openThemes();
            return;
          }
          const opt = e.target.closest("[data-pick]");
          if (!opt) return;
          const key = opt.getAttribute("data-pick");
          const val = opt.getAttribute("data-val");
          state[key] = val;
          touched[key] = true;
          if (key === "shape") {
            /* sizes follow the shape — reset to that shape's middle size */
            const list = SIZES[val];
            state.size = list[Math.floor((list.length - 1) / 2)].id;
            delete touched.size;
          }
          if (key === "type" && !HEIGHTS[val].includes(state.height)) {
            state.height = "8";
            delete touched.height;
          }
          if (key === "style" && val === "none") {
            /* a plain cake carries no topper and no frosting colour */
            state.themes = [];
            state.colour = "white";
            delete touched.colour;
          }
          if (key === "msgOn") {
            /* either answer settles the (optional) Message step */
            touched.message = true;
            if (val === "0") state.message = "";
          }
          renderPanel();
          syncTabs();
          updateCake(true);
          /* Picking "Themed Topper" opens the figure picker straight away. */
          if (key === "style" && val === "themed") openThemes();
        });

        panelEl.addEventListener("input", (e) => {
          const t = e.target.closest("[data-cake-text]");
          if (!t) return;
          state.message = t.value.trim();
          touched.message = true;
          syncTabs();
          updateCake(false);
        });

        addBtn.addEventListener("click", () => {
          document.querySelectorAll("[data-cart-count]").forEach((b) => {
            b.textContent = (parseInt(b.textContent, 10) || 0) + 1;
            const cart = b.closest("[data-open='cart'], [data-floating-cart]");
            if (cart) { cart.classList.add("cart-bump"); setTimeout(() => cart.classList.remove("cart-bump"), 500); }
          });
          addBtn.textContent = "Added to Cart ✓";
          addBtn.classList.add("pointer-events-none", "opacity-70");
          setTimeout(() => {
            addBtn.textContent = "Add to Cart";
            addBtn.classList.remove("pointer-events-none", "opacity-70");
          }, 1800);
        });

        buildStepper();
        syncStepper();
        renderPanel();
        updateCake(false);
      })();
    </script>
  </body>
</html>
